<fieldset>
  <legend>Identificação fiscal da nota</legend>
  <p>Confira os dados impressos. Corrigir estes campos não realiza lançamento financeiro.</p>
  {{ fiscal.non_field_errors }}
  {% for campo in fiscal %}
    <div>
      {{ campo.label_tag }}
      {{ campo }}
      {% if campo.help_text %}<p class="texto-apoio">{{ campo.help_text }}</p>{% endif %}
      {{ campo.errors }}
    </div>
  {% endfor %}
</fieldset>
